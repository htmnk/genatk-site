name: Site PR checks

on:
  pull_request:
    paths:
      - 'apps/site/**'
      - 'marketing/**'
      - 'tools/seo/**'
      - 'package*.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
